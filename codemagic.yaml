workflows:
  android-apk:
    name: NetQueue Android APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.gradle/caches
    scripts:
      - name: Validar projeto Flutter
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          bash scripts/preflight.sh
      - name: Pacotes Flutter
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          flutter pub get
      - name: APK release
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          set +e
          flutter build apk --release 2>&1 | tee /tmp/fluxnet-build.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -ne 0 ]; then
            echo '===== CLASSIFICACAO DE ERROS ====='
            grep -Ei 'what went wrong|FAILURE:|Execution failed|Could not resolve|Unresolved reference|error:|Duplicate class|Manifest merger failed|namespace|jcenter|kotlin|gradle' /tmp/fluxnet-build.log | tail -100 || true
            exit "$code"
          fi
          echo "Arquivos APK gerados:"
          find build android/app/build -type f -name '*.apk' -print 2>/dev/null || true
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
