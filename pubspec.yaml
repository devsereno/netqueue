name: netqueue
description: App que controla a fila de acesso à internet após longo período offline para evitar travamentos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  device_apps: ^2.2.0
  permission_handler: ^11.3.1
  flutter_foreground_task: ^8.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
